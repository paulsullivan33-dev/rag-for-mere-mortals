site_name: RAG for Mere Mortals
site_description: Asking questions of your own documents and getting answers grounded in them. Chunking, embeddings, retrieval and the grounded prompt, built with plain tools, and one honesty rule throughout — an answer cites its sources, or admits the documents do not say.
